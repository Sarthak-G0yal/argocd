apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web
spec:
  selector:
    matchLabels:
      app: python-web
  template:
    metadata:
      labels:
        app: python-web
    spec:
      containers:
        - name: python-web
          image: python-web:latest
          imagePullPolicy: Never
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: python-web
spec:
  type: NodePort
  selector:
    app: python-web
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30001
